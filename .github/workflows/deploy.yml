# Publish the site to DreamHost whenever master changes.
#
# Uploads over SFTP (works with an SFTP-only DreamHost user). Every file type
# and folder is included, files are sent exactly as they are in git, nothing
# on the server is deleted, and config.js, api/soundcloud-config.php and
# api/lastfm-config.php (which live only on the server) are never touched.
# Before uploading, it checks the target folder already holds config.js, so a
# wrong path or login stops the publish instead of copying the site somewhere
# else.
#
# The root .htaccess (security headers) is merged, not overwritten: the repo's
# file goes into a "# BEGIN firetable" … "# END firetable" block at the top of
# the server's .htaccess and every other rule there is kept. The previous copy
# is saved as .htaccess.firetable-previous, and if the site starts answering
# with a server error the old file is put back and the run fails.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DREAMHOST_HOST      server hostname, e.g. iad1-shared-b8-12.dreamhost.com
#   DREAMHOST_USER      the site's SFTP user
#   DREAMHOST_PASSWORD  that user's password
#   DREAMHOST_PATH      site folder, e.g. indiediscotheque.com (relative to
#                       the user's home; "/indiediscotheque.com" also works)
#
# Optional repository variable (same page, "Variables" tab):
#   SITE_URL            the site's address, for the check after the .htaccess
#                       update. Default: https://<last part of DREAMHOST_PATH>/
#                       when that looks like a domain.
#
# Manual run: Actions → "Deploy to DreamHost" → Run workflow. "Dry run" lists
# what would change without uploading anything.

name: Deploy to DreamHost

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only list what would change)"
        type: boolean
        default: true

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.DREAMHOST_HOST }}
      SFTP_USER: ${{ secrets.DREAMHOST_USER }}
      LFTP_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
      DEST_RAW: ${{ secrets.DREAMHOST_PATH }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to give files their last-commit times
          persist-credentials: false

      - name: Check secrets
        run: |
          missing=""
          for v in HOST SFTP_USER LFTP_PASSWORD DEST_RAW; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing DreamHost secret(s):$missing"
            exit 1
          fi

      - name: Prepare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach $HOST over SFTP (port 22). Check DREAMHOST_HOST."
            exit 1
          fi
          # Give each file its last-commit time, so only files changed in git
          # differ from the server copy on later runs.
          git ls-files -z | while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f")
            [ -n "$t" ] && touch -m -d "@$t" "$f"
          done
          # "/indiediscotheque.com" (FTP style) means the folder in the home directory
          DEST="$DEST_RAW"
          case "$DEST" in
            /home/*) ;;
            /*) DEST="${DEST#/}" ;;
          esac
          DEST="${DEST%/}"
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          cat > ~/.lftprc <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=no"
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit yes
          EOF

      - name: Safety check (target folder must already hold config.js)
        run: |
          if ! lftp -c "open --env-password -u \"$SFTP_USER\" \"sftp://$HOST\"; cls -1 \"$DEST/config.js\"" >/dev/null; then
            echo "::error::Couldn't find $DEST/config.js on the server. Either the login failed or DREAMHOST_PATH is wrong. Nothing was uploaded."
            exit 1
          fi
          echo "Found $DEST/config.js - target folder looks right."

      - name: Upload changed files
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then
            flags="--dry-run"
            echo "Dry run: nothing will be uploaded."
          fi
          # The root .htaccess is merged by the next step; api/.htaccess is
          # uploaded like any other file
          flags="$flags --exclude '^\.htaccess\$'"
          lftp -c "open --env-password -u \"$SFTP_USER\" \"sftp://$HOST\"; \
            mirror --reverse --verbose --no-perms --parallel=4 $flags \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob tools/ \
              --exclude-glob node_modules/ \
              --exclude-glob package.json \
              --exclude-glob package-lock.json \
              --exclude-glob eslint.config.mjs \
              --exclude-glob .gitignore \
              --exclude-glob .DS_Store \
              --exclude-glob config.js \
              --exclude-glob soundcloud-config.php \
              --exclude-glob lastfm-config.php \
              --exclude-glob README.md \
              ./ \"$DEST/\""

      - name: Merge the security headers into the server's .htaccess
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          work=$(mktemp -d)
          remote() { lftp -c "open --env-password -u \"$SFTP_USER\" \"sftp://$HOST\"; $1"; }
          had=0
          if remote "cls -1 \"$DEST/.htaccess\"" >/dev/null 2>&1; then
            remote "get \"$DEST/.htaccess\" -o \"$work/server\""
            had=1
          fi
          rc=0
          python3 .github/scripts/merge-htaccess.py .htaccess "$work/server" "$work/merged" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "Server .htaccess is already up to date."
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if [ "$had" = 1 ]; then
            echo "Changes to the server's .htaccess:"
            diff -u "$work/server" "$work/merged" || true
          else
            echo "No .htaccess on the server yet - uploading the repo's block."
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: .htaccess not changed."
            exit 0
          fi

          url="$SITE_URL"
          if [ -z "$url" ]; then
            d=$(basename "$DEST")
            case "$d" in *.*) url="https://$d/" ;; esac
          fi
          status() { curl -s -o /dev/null -m 20 -w '%{http_code}' "$url" || true; }
          before=""
          [ -n "$url" ] && before=$(status)

          [ "$had" = 1 ] && remote "put \"$work/server\" -o \"$DEST/.htaccess.firetable-previous\""
          remote "put \"$work/merged\" -o \"$DEST/.htaccess\""
          echo "Server .htaccess updated."

          if [ -z "$url" ]; then
            echo "::warning::Set the SITE_URL repository variable so the deploy can check the site still loads after an .htaccess change."
            exit 0
          fi
          sleep 3
          after=$(status)
          echo "Site check: $url answered $after (before the change: ${before:-n/a})."
          case "$after" in
            5*)
              case "$before" in 5*) echo "::warning::The site was already answering $before before this change." ; exit 0 ;; esac
              if [ "$had" = 1 ]; then
                remote "put \"$work/server\" -o \"$DEST/.htaccess\""
              else
                remote "rm \"$DEST/.htaccess\""
              fi
              echo "::error::The site answered $after after the .htaccess update, so the previous .htaccess was restored. The server may not allow one of the directives in the repo's .htaccess."
              exit 1
              ;;
          esac
          if ! curl -s -I -m 20 "$url" | grep -qi '^content-security-policy:'; then
            echo "::warning::The site loads but sends no Content-Security-Policy header (is mod_headers enabled?)."
          fi

      - name: Remove files that were deleted from the repo
        # Only files git deleted in the pushed commits (never config.js,
        # server-only files or anything else not tracked here).
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with - nothing to remove."
            exit 0
          fi
          script=$(mktemp)
          printf 'open --env-password -u "%s" "sftp://%s"\n' "$SFTP_USER" "$HOST" > "$script"
          count=0
          while IFS= read -r -d '' f; do
            case "$f" in
              config.js|api/soundcloud-config.php|api/lastfm-config.php|.htaccess|.htaccess.firetable-previous|README.md|.gitignore|.github/*|tools/*|node_modules/*|package.json|package-lock.json|eslint.config.mjs|*.DS_Store) continue ;;
            esac
            printf 'rm -f "%s/%s"\n' "$DEST" "$f" >> "$script"
            echo "Removing $f"
            count=$((count + 1))
          done < <(git diff --name-only --diff-filter=D -z "$BEFORE" HEAD)
          if [ "$count" -eq 0 ]; then
            echo "Nothing to remove."
            exit 0
          fi
          lftp -f "$script"
