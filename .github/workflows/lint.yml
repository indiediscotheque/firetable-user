# Checks every pull request (and master, before each deploy): ESLint on the site's scripts, that the
# stylesheets flatten for older Safari and every script and stylesheet minifies
# (what the deploy serves), a PHP syntax
# check on the API proxies, and that the CSP in .htaccess covers every
# published path. Run the same locally with:
#   npm ci && npm run lint && node tools/flatten-css.mjs --check && node tools/minify.mjs --check && node tools/check-colours.mjs && node tools/share-cards.mjs --check && node --test tools/social/social.test.mjs && node tools/social/run.mjs check && php -l api/*.php && python3 .github/scripts/check-htaccess-scope.py

name: Lint

on:
  pull_request: # not on push too: every branch gets a pull request, and the same commit ran twice
  workflow_call: # master: the deploy runs these checks first

# a newer push to the pull request stops the older run (the deploy's runs are never stopped)
concurrency:
  group: lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: ESLint
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: Stylesheets flatten for older Safari
        run: node tools/flatten-css.mjs --check

      - name: Scripts and stylesheets minify (as the deploy serves them)
        run: node tools/minify.mjs --check

      - name: Greys come from the palette
        run: node tools/check-colours.mjs

      # the library pages' share images (tools/share-cards.mjs): one is drawn here, as the deploy draws them
      - name: Share images draw
        run: node tools/share-cards.mjs --check

      # the social posts (tools/social/): their captions, signing and routing, and the pictures
      # (and a video where ffmpeg is installed) drawn as .github/workflows/social.yml draws them
      - name: Social posting
        run: |
          node --test tools/social/social.test.mjs
          node tools/social/run.mjs check

      - name: PHP syntax
        run: |
          for f in api/*.php api/*.php.example; do php -l "$f"; done

      - name: CSP scope in .htaccess
        run: python3 .github/scripts/check-htaccess-scope.py
