# Checks every push and pull request: ESLint on the site's scripts and a PHP
# syntax check on the API proxies, and that the CSP in .htaccess covers every
# published path. Run the same locally with:
#   npm ci && npm run lint && php -l api/*.php && python3 .github/scripts/check-htaccess-scope.py

name: Lint

on:
  push:
  pull_request:
  workflow_call: # the deploy runs these checks first

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: ESLint
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: PHP syntax
        run: |
          for f in api/*.php api/*.php.example; do php -l "$f"; done

      - name: CSP scope in .htaccess
        run: python3 .github/scripts/check-htaccess-scope.py
