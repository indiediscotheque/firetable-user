# Browser tests in Chromium, under the real Content-Security-Policy from
# .htaccess, on every push and pull request:
# - unit: the site's own functions (escaping, the chat formatter, keys, ...)
# - smoke: the site against a local database emulator. Fails on page errors
#   or anything the policy blocks, and checks the stage effects load on first use
# - rules: the site's reads and writes, as real signed-in accounts, against
#   the hostbot's database rules (firetable-hostbot master). Fails on any write
#   or read the rules refuse
# Run the same locally (Java 21 needed):
#   cd tests && npm ci && npx playwright install chromium && npm run unit && npm run smoke
#   HOSTBOT_RULES=../../firetable-hostbot/firebase-rules.json npm run rules
# They load the CDN libraries and YouTube's player API, so each suite gets a
# second try before it fails. On master they run as part of the deploy
# (.github/workflows/deploy.yml), which only publishes if they pass.

name: Browser tests

on:
  push:
    branches-ignore: [master] # master: the deploy runs these first
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install
        id: install
        run: |
          cd tests
          npm ci --no-audit --no-fund
          # the browser's system packages come from Ubuntu's servers: a few tries
          for try in 1 2 3; do
            bash ../.github/scripts/apt-mirror.sh
            npx playwright install --with-deps chromium && break
            [ "$try" = 3 ] && exit 1
            echo "Ubuntu's package servers didn't answer (try $try); waiting..."
            sleep $((try * 30))
          done

      - name: Unit tests
        run: |
          cd tests
          npm run unit || { echo "::warning::Unit tests failed; one more try (CDNs can be slow)"; npm run unit; }

      - name: Smoke test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          cd tests
          npm run smoke || { echo "::warning::Smoke test failed; one more try (CDNs and YouTube can be slow)"; npm run smoke; }

      - name: Check out the hostbot's database rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: indiediscotheque/firetable-hostbot
          ref: master
          path: .hostbot
          sparse-checkout: firebase-rules.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Rules test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          cd tests
          export HOSTBOT_RULES=../.hostbot/firebase-rules.json
          npm run rules || { echo "::warning::Rules test failed; one more try (CDNs can be slow)"; npm run rules; }
