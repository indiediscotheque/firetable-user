<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Indie Discotheque · Live</title>
	<!-- The live stage for QueUp's screen (embed/stage/stage.js): unlisted, never indexed -->
	<meta name="robots" content="noindex, nofollow" />
	<meta name="theme-color" content="#181818" />
	<link rel="icon" type="image/png" href="../../favicon.png?v=1" />
	<link rel="stylesheet" href="../../css/fonts-local.css?v=1" />
	<link rel="stylesheet" href="stage.css?v=1" />
</head>
<body>
	<main id="st" class="is-loading" aria-label="Indie Discotheque, live">
		<div class="st-bg" aria-hidden="true"><div class="st-blur" id="st-blur"></div><div class="st-logo"></div></div>
		<div class="st-disc" aria-hidden="true"><div class="st-vinyl"><span class="st-label" id="st-label"></span></div></div>
		<div class="st-screen" aria-hidden="true"><div id="st-yt"></div><div class="st-shield"></div></div>
		<div class="st-shade" aria-hidden="true"></div>

		<header class="st-top">
			<a class="st-brand" id="st-brand" target="_blank" rel="noopener" title="Open Indie Discotheque">
				<img src="../../img/idlogo2.png?v=1" alt="" width="64" height="30" />
				<span class="st-name" id="st-name">Indie Discotheque</span>
				<span class="st-live"><i aria-hidden="true"></i>Live</span>
			</a>
			<span class="st-count" id="st-count" hidden></span>
			<span class="st-theme" id="st-theme" hidden><b>Theme</b><span id="st-themeText"></span></span>
			<div class="st-ctl">
				<div class="st-vol" id="st-vol" hidden>
					<button type="button" class="st-icon" id="st-mute" aria-label="Mute">
						<svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z" /></svg>
						<svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z" /></svg>
					</button>
					<input type="range" id="st-volume" min="0" max="100" step="5" value="80" aria-label="Volume" />
				</div>
				<a class="st-icon st-open" id="st-open" target="_blank" rel="noopener" aria-label="Open the room in a new tab" title="Open the room">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" /></svg>
				</a>
			</div>
		</header>

		<button type="button" class="st-listen" id="st-listen" hidden>
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z" /></svg>
			<span>Listen live</span>
			<small id="st-listenSub">Hear the room, in sync</small>
		</button>

		<section class="st-quiet" id="st-quiet" hidden>
			<img src="../../img/idlogo2.png?v=1" alt="" width="128" height="60" />
			<h1>The decks are open</h1>
			<p>Hop on and play something at <a id="st-quietLink" target="_blank" rel="noopener"></a></p>
		</section>

		<footer class="st-low" id="st-low" aria-live="polite">
			<span class="st-art" id="st-art"></span>
			<div class="st-now">
				<p class="st-kicker" id="st-kicker"></p>
				<h1 class="st-title" id="st-title">Tuning in…</h1>
				<p class="st-artist" id="st-artist"></p>
			</div>
			<ol class="st-deck" id="st-deck" aria-label="On the decks"></ol>
		</footer>
		<div class="st-prog" id="st-prog" aria-hidden="true">
			<span class="st-time" id="st-at"></span>
			<span class="st-bar"><i id="st-bar"></i></span>
			<span class="st-time" id="st-left"></span>
		</div>
		<p class="st-note" id="st-note" role="status" hidden></p>
	</main>
	<!-- SoundCloud's player: given its address the first time a SoundCloud song plays -->
	<iframe id="st-sc" title="SoundCloud player" allow="autoplay; encrypted-media" tabindex="-1" aria-hidden="true"></iframe>

	<script src="../../config.js?v=nocache"></script>
	<script src="../../js/constants.js?v=1"></script>
	<script src="../../js/seasons.js?v=1"></script>
	<script src="stage.js?v=1"></script>
	<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
