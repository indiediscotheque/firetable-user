<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Offline · Indie Discotheque</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="theme-color" content="#181818" />
	<meta name="robots" content="noindex" />
	<!-- Shown by sw.js when the site can't be reached. Kept in the service
	     worker's cache with the logo, so it has no other files: styles are
	     attributes (the policy allows no <style>), fonts are the system's. It
	     checks again every 20 seconds and opens the room once it answers. -->
	<meta http-equiv="refresh" content="20" />
</head>

<body style="margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; background:#181818; color:#fff; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing:antialiased;">
	<main style="max-width:28rem; padding:2rem 1.5rem; text-align:center;">
		<img src="img/idlogo2.png" alt="Indie Discotheque" width="150" height="70" style="display:block; margin:0 auto 2rem; width:150px; height:auto;" />
		<h1 style="margin:0 0 0.75rem; font-size:1.5rem; font-weight:700; letter-spacing:-0.01em;">You're offline</h1>
		<p style="margin:0 0 1.75rem; color:rgba(255,255,255,0.72); font-size:1rem; line-height:1.5;">The room plays live, so it needs the internet. This page tries again on its own every 20 seconds, and opens once you're back.</p>
		<a href="" style="display:inline-block; padding:0.65rem 1.25rem; border-radius:8px; background:#2a2a2a; color:#cc9933; font-weight:600; font-size:0.9375rem; text-decoration:none;">Try again</a>
	</main>
</body>

</html>
